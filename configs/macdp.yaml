# MACDP Configuration
server:
  host: "0.0.0.0"
  port: 8080

storage:
  path: "macdp.db"

llm:
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  api_key_env: "DEEPSEEK_API_KEY"

agents:
  - name: "hermes"
    type: "hermes"
    enabled: true
    config:
      binary: "hermes"

  - name: "claude-code"
    type: "claude-code"
    enabled: false
    config:
      binary: "claude"

  - name: "codex"
    type: "codex"
    enabled: false
    config:
      binary: "codex"

git:
  worktree_dir: ".macdp/worktrees"
  branch_prefix: "macdp/"
  merge_strategy: "squash"

# MACDP - Multi-Agent Collaborative Development Platform
# Default configuration

orchestrator: hermes

agents:
  - name: hermes
    enabled: true
    role: orchestrator
    entrypoint: hermes
    max_concurrent: 3
    strengths: [orchestration, testing, debugging, general_tasks]

  - name: claude-code
    enabled: true
    role: worker
    entrypoint: claude
    flags: ["--output-format", "json"]
    max_concurrent: 3
    strengths: [complex_code, refactoring, review]

  - name: codex
    enabled: true
    role: worker
    entrypoint: codex
    flags: ["--full-auto"]
    max_concurrent: 5
    strengths: [prototyping, single_file, scripts]

scheduler:
  max_parallel: 5
  task_timeout_seconds: 600
  max_retries: 2

git:
  worktree_dir: ".macdp/worktrees"
  branch_prefix: "macdp/"
  merge_strategy: squash

review:
  enabled: true
  cross_review: true
  max_review_rounds: 3
  approval_required: false

budget:
  max_per_task_usd: 5.0
  max_per_project_usd: 50.0

api:
  host: "0.0.0.0"
  port: 8080
